<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshFeed settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="options-page">
  <main>
    <h1>FreshFeed settings</h1>
    <h2>Upload date filter</h2>
    <label class="switch-row"><span>Enable upload date filter</span><input id="filter-upload-date" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <div id="upload-date-options" class="filter-options" hidden>
      <label>Mode <select id="upload-date-mode"><option value="onlyPast">Only past</option><option value="olderThan">Block older than</option><option value="between">Between</option></select></label>
      <label>Value <input id="upload-date-value" class="inline-number" type="number" min="1" max="3650" step="1"><select id="upload-date-unit"><option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option></select></label>
      <label id="upload-date-between">From <input id="upload-date-min" class="inline-number" type="number" min="1" max="3650" step="1"> to <input id="upload-date-max" class="inline-number" type="number" min="1" max="3650" step="1"> <span class="unit-label">days</span></label>
    </div>
    <h2>Duration Filter</h2>
    <label class="switch-row"><span>Enable duration filter</span><input id="filter-duration" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <div id="duration-options" class="filter-options" hidden>
      <label>Mode <select id="duration-mode"><option value="onlyShorter">Only shorter than</option><option value="longerThan">Block longer than</option><option value="between">Between</option></select></label>
      <label>Value <input id="duration-value" class="inline-number" type="number" min="1" max="100000" step="1"><select id="duration-unit"><option value="seconds">seconds</option><option value="minutes">minutes</option><option value="hours">hours</option><option value="days">days</option></select></label>
      <label id="duration-between">From <input id="duration-min" class="inline-number" type="number" min="1" max="100000" step="1"> to <input id="duration-max" class="inline-number" type="number" min="1" max="100000" step="1"> <span class="duration-unit-label">minutes</span></label>
    </div>
    <h2>Subscription data</h2>
    <p id="count">Subscribed: 0 · Blacklisted: 0</p>
    <p id="synced">Last sync: never</p>
    <div id="progress-wrap" hidden><div class="progress-bar"><span></span></div><p id="progress-text">Syncing…</p></div>
    <section class="diagnostics">
      <h2>Diagnostics</h2>
      <pre id="result">No sync details.</pre>
      <button id="copy-result" class="secondary" type="button">Copy details</button>
    </section>
    <button id="sync" type="button">Sync subscriptions</button>
    <button id="clear" class="secondary" type="button">Clear subscribed channels</button>
  </main>
  <script src="options.js"></script>
</body>
</html>

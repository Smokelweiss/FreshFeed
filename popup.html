<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshFeed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>FreshFeed</h1>
    <h2>Filtering</h2>
    <label class="switch-row"><span>Hide subscribed channels</span><input id="hide-subscribed" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide “Not interested” channels</span><input id="hide-not-interested" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide Shorts</span><input id="hide-shorts" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Filter recommendations</span><input id="filter-recommendations" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Update after Subscribe</span><input id="update-subscriptions" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide YouTube Playables</span><input id="hide-playables" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide Members-only videos</span><input id="hide-members-only" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide Mix / Radio playlists</span><input id="hide-mix-radio" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide videos older than <input id="upload-date-days" class="inline-number" type="number" min="1" max="3650" step="1"> days</span><input id="filter-upload-date" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Hide videos longer than <input id="max-duration-minutes" class="inline-number" type="number" min="1" max="1440" step="1"> min</span><input id="filter-duration" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    <p id="count">Subscribed: 0 · Blacklisted: 0</p>
    <p id="synced">Last sync: never</p>
    <div id="progress-wrap" hidden>
      <div class="progress-bar"><span></span></div>
      <p id="progress-text">Syncing… found 0</p>
    </div>
    <p id="result" class="result" hidden></p>
    <button id="sync" type="button">Sync subscriptions</button>
    <button id="clear" class="secondary" type="button">Clear list</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>

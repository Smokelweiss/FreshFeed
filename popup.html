<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshFeed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="app-header">
      <h1>FreshFeed</h1>
      <div class="master-row" role="group" aria-label="Extension master switch">
        <span id="master-label"></span>
        <label class="switch-row master">
          <span class="sr-only">Enable FreshFeed</span>
          <input id="enabled" type="checkbox" aria-labelledby="master-label">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </header>

    <fieldset class="setting-group all-trash-group">
      <legend>Block All Trash</legend>
      <label class="switch-row all-trash"><span>Block all trash (enables everything below)</span><input id="block-all-trash" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </fieldset>

    <fieldset class="setting-group group-channels" data-trash-group>
      <legend>Channels</legend>
      <label class="switch-row"><span>Hide Subscribed Channels</span><input id="hide-subscribed" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide Blacklisted</span><input id="hide-blacklisted" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </fieldset>

    <fieldset class="setting-group group-content-types" data-trash-group>
      <legend>Content types</legend>
      <label class="switch-row"><span>Hide Shorts</span><input id="hide-shorts" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide YouTube Playables</span><input id="hide-playables" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide Members-only videos</span><input id="hide-members-only" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide Mix / Radio playlists</span><input id="hide-mix-radio" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </fieldset>

    <fieldset class="setting-group group-promoted" data-trash-group>
      <legend>Promoted &amp; generated blocks</legend>
      <label class="switch-row"><span>Hide live &amp; upcoming streams</span><input id="hide-live-streams" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide community posts</span><input id="hide-community-posts" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide Movies &amp; storefront shelves</span><input id="hide-storefront-shelves" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide brand &amp; promo banners</span><input id="hide-promo-shelves" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide surveys &amp; upsell popups</span><input id="hide-surveys" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide "More topics" shelves</span><input id="hide-topic-shelves" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Hide all YouTube-generated topic shelves</span><input id="hide-generated-shelves" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </fieldset>

    <fieldset class="setting-group">
      <legend>Advanced filters</legend>
      <label class="switch-row"><span>Upload date filter</span><input id="filter-upload-date" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <div id="upload-date-options" class="filter-options" hidden>
        <label><span>Mode</span> <select id="upload-date-mode"><option value="onlyPast">Only past</option><option value="olderThan">Block older than</option><option value="between">Between</option></select></label>
        <label id="upload-date-filter-value" class="filter-value-row" hidden><span>Value</span> <input id="upload-date-value" class="inline-number" type="number" min="1" max="3650" step="1"><select id="upload-date-unit"><option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option></select></label>
        <label id="upload-date-between" hidden><span>From</span> <input id="upload-date-min" class="inline-number" type="number" min="1" max="3650" step="1"> <span>to</span> <input id="upload-date-max" class="inline-number" type="number" min="1" max="3650" step="1"> <span class="unit-label">days</span></label>
      </div>

      <label class="switch-row"><span>Duration filter</span><input id="filter-duration" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <div id="duration-options" class="filter-options" hidden>
        <label><span>Mode</span> <select id="duration-mode"><option value="onlyShorter">Only shorter than</option><option value="longerThan">Block longer than</option><option value="between">Between</option></select></label>
        <label id="duration-filter-value" class="filter-value-row" hidden><span>Value</span> <input id="duration-value" class="inline-number" type="number" min="1" max="100000" step="1"><select id="duration-unit"><option value="seconds">seconds</option><option value="minutes">minutes</option><option value="hours">hours</option><option value="days">days</option></select></label>
        <label id="duration-between" hidden><span>From</span> <input id="duration-min" class="inline-number" type="number" min="1" max="100000" step="1"> <span>to</span> <input id="duration-max" class="inline-number" type="number" min="1" max="100000" step="1"> <span class="duration-unit-label">minutes</span></label>
      </div>
    </fieldset>

    <fieldset class="setting-group">
      <legend>Features</legend>
      <label class="switch-row"><span>Background feed preload (loads ahead of your scroll)</span><input id="bg-preload" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
      <label class="switch-row"><span>Endless feed (periodically generates new videos)</span><input id="endless-feed" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </fieldset>

    <p id="error" class="error" hidden></p>
    <button id="settings" class="secondary" type="button">Extension settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>

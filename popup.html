<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshFeed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>FreshFeed</h1>
    <label class="switch-row">
      <span>Enabled</span>
      <input id="enabled" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <p id="count">Channels: 0</p>
    <p id="synced">Last sync: never</p>
    <div id="progress-wrap" hidden>
      <div class="progress-bar"><span></span></div>
      <p id="progress-text">Syncing… found 0</p>
    </div>
    <p id="result" class="result" hidden></p>
    <button id="sync" type="button">Sync subscriptions</button>
    <button id="clear" class="secondary" type="button">Clear list</button>
    <p class="hint">New subscriptions are added immediately after clicking YouTube's Subscribe button. Use sync to import existing subscriptions.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
